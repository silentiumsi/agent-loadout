# Blocks secrets from reaching this public repository. Requires Go.
pre-commit:
  commands:
    secrets:
      run: go run github.com/betterleaks/betterleaks@v1.9.0 git --pre-commit --staged --redact --no-banner .

pre-push:
  commands:
    secrets:
      run: go run github.com/betterleaks/betterleaks@v1.9.0 git --redact --no-banner .
