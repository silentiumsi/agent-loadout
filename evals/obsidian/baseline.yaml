# Same tasks, agents and models as with-skill.yaml, without the skill.
tasks:
  - path: evals/obsidian/tasks/reading-list
  - path: evals/obsidian/tasks/ambiguous-vault
agents:
  - name: codex
    model_name: openai/gpt-6.1-terra
    env:
      CODEX_FORCE_AUTH_JSON: "1"
  - name: claude-code
    model_name: anthropic/claude-sonnet-5-5
    env:
      CLAUDE_FORCE_OAUTH: "1"
n_concurrent_trials: 1
