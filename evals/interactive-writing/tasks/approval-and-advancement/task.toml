artifacts = ["/app/guide.md"]
multi_step_reward_strategy = "mean"

[agent]
timeout_sec = 180

[verifier.environment]
network_mode = "no-network"

[[steps]]
name = "approach"
[steps.verifier.env]
WRITING_STAGE = "approach"

[[steps]]
name = "first-increment"
[steps.verifier.env]
WRITING_STAGE = "first-increment"

[[steps]]
name = "approval"
[steps.verifier.env]
WRITING_STAGE = "approval"

[[steps]]
name = "another-approval"
[steps.verifier.env]
WRITING_STAGE = "another-approval"
