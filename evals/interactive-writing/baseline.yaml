tasks:
  - path: evals/interactive-writing/tasks/approval-and-advancement
  - path: evals/interactive-writing/tasks/revision-and-delivery
  - path: evals/interactive-writing/tasks/meaning-across-edits
agents:
  - name: codex
    model_name: openai/gpt-6.1-terra
    resume_trajectory: true
    env:
      CODEX_FORCE_AUTH_JSON: "1"
  - name: claude-code
    model_name: anthropic/claude-sonnet-5-5
    resume_trajectory: true
    env:
      CLAUDE_FORCE_OAUTH: "1"
n_concurrent_trials: 16
