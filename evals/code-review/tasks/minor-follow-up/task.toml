artifacts = ["/app", "/logs/agent"]
multi_step_reward_strategy = "mean"

[agent]
timeout_sec = 900

[verifier]
environment_mode = "separate"
timeout_sec = 600

[verifier.env]
CODEX_AUTH_JSON = "${CODEX_AUTH_JSON}"
REWARDKIT_FORCE_SUBSCRIPTION = "1"

[verifier.environment]
network_mode = "public"

[[steps]]
name = "initial"
[steps.verifier.env]
REVIEW_STAGE = "initial"

[[steps]]
name = "adjustment"
[steps.verifier.env]
REVIEW_STAGE = "adjustment"
